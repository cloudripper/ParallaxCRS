name: crs-finder-parallax
type:
- bug-finding
version: 1.0.0

# No prepare_phase: the runner builds FROM the framework-provided
# base_runner_image at run time and installs its own tooling.

target_build_phase:
- name: build
  dockerfile: oss-crs/dockerfiles/builder.Dockerfile
  outputs:
  - build
  - src
- name: coverage-build
  dockerfile: oss-crs/dockerfiles/coverage-builder.Dockerfile
  outputs:
  - coverage
- name: debug-build
  dockerfile: oss-crs/dockerfiles/debug-builder.Dockerfile
  outputs:
  - debug
- name: codeql-build
  dockerfile: oss-crs/dockerfiles/codeql-builder.Dockerfile
  outputs:
  - codeql

crs_run_phase:
  main:
    dockerfile: oss-crs/dockerfiles/runner.Dockerfile
    additional_env:
      # Defaults; override in the compose file's additional_env.
      # The production entrypoint. Other upstream experiments require an
      # explicit CRS_ENABLE_EXPERIMENTAL_ENTRYPOINTS=1 opt-in.
      CRS_ENTRYPOINT: run_crs
      ANTHROPIC_MODEL: claude-opus-5
      CLAUDE_CODE_SUBAGENT_MODEL: claude-sonnet-5
      ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5
      ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-5
      ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek/deepseek-v4.1-flash
      ANTHROPIC_DEFAULT_FABLE_MODEL: qwen/qwen3.8-max
      CLAUDE_CODE_EFFORT_LEVEL: high
      CLAUDE_CODE_ALWAYS_ENABLE_EFFORT: "1"
      # Optional OAuth fallback. LiteLLM-mode wrappers explicitly clear this
      # variable so Claude Code uses the framework-injected proxy instead.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      # AGENT_TIMEOUT: "0"   # seconds, 0 = no limit (default)

supported_target:
  mode:
  - full
  - delta
  language:
  - c
  - c++
  sanitizer:
  - address
  architecture:
  - x86_64
  fuzzing_engine:
  - libfuzzer

required_llms:
- claude-opus-5
- claude-sonnet-5
- deepseek/deepseek-v4.1-flash
- qwen/qwen3.8-max
